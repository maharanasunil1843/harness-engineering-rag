<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0A0F"/>
      <stop offset="100%" stop-color="#12121A"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#71717A"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>

  <!-- Constellation: a network of nodes + links that pulse, echoing the live hero. -->
  <g stroke="#60A5FA" stroke-width="1" stroke-opacity="0.35">
    <line x1="150" y1="80" x2="320" y2="140"><animate attributeName="stroke-opacity" values="0.1;0.5;0.1" dur="4s" repeatCount="indefinite"/></line>
    <line x1="320" y1="140" x2="240" y2="250"><animate attributeName="stroke-opacity" values="0.5;0.1;0.5" dur="5s" repeatCount="indefinite"/></line>
    <line x1="320" y1="140" x2="500" y2="90"><animate attributeName="stroke-opacity" values="0.2;0.6;0.2" dur="6s" repeatCount="indefinite"/></line>
    <line x1="900" y1="90" x2="1040" y2="150"><animate attributeName="stroke-opacity" values="0.1;0.5;0.1" dur="4.5s" repeatCount="indefinite"/></line>
    <line x1="1040" y1="150" x2="950" y2="250"><animate attributeName="stroke-opacity" values="0.5;0.15;0.5" dur="5.5s" repeatCount="indefinite"/></line>
    <line x1="1040" y1="150" x2="880" y2="220"><animate attributeName="stroke-opacity" values="0.2;0.5;0.2" dur="6.5s" repeatCount="indefinite"/></line>
  </g>
  <g>
    <circle cx="150" cy="80" r="3.5" fill="#3B82F6"><animate attributeName="r" values="2.5;4.5;2.5" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="140" r="4" fill="#14B8A6"><animate attributeName="r" values="3;5;3" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="240" cy="250" r="3" fill="#3B82F6"><animate attributeName="r" values="2;4;2" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="90" r="3" fill="#EA580C"><animate attributeName="r" values="2;4;2" dur="5.5s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="90" r="3.5" fill="#14B8A6"><animate attributeName="r" values="2.5;4.5;2.5" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="150" r="4" fill="#3B82F6"><animate attributeName="r" values="3;5;3" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="950" cy="250" r="3" fill="#EA580C"><animate attributeName="r" values="2;4;2" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="220" r="3" fill="#3B82F6"><animate attributeName="r" values="2;3.8;2" dur="6.5s" repeatCount="indefinite"/></circle>
  </g>

  <text x="600" y="150" text-anchor="middle" font-size="52" font-weight="700" fill="url(#title)" letter-spacing="-1">Harness Engineering RAG</text>
  <text x="600" y="192" text-anchor="middle" font-size="20" font-weight="400" fill="#A1A1AA">Agentic RAG · hybrid retrieval · text-to-SQL · semantic cache</text>

  <g font-size="13" font-weight="500" fill="#71717A">
    <text x="600" y="244" text-anchor="middle" letter-spacing="2">LANGGRAPH&#160;&#160;·&#160;&#160;CLAUDE&#160;&#160;·&#160;&#160;PGVECTOR&#160;&#160;·&#160;&#160;FASTAPI&#160;&#160;·&#160;&#160;NEXT.JS</text>
  </g>

  <!-- Streaming-token cursor blink, a subtle nod to the SSE chat. -->
  <rect x="824" y="132" width="10" height="22" fill="#3B82F6">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
